<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 🔍 SEO Meta Tags -->
    <title>Tech.Shop — Интернет-магазин компьютерной электроники</title>
    <meta name="description" content="Купить компьютерную электронику: видеокарты, процессоры, накопители, периферию. Гарантия качества, быстрая доставка, выгодные цены." />
    <meta name="keywords" content="компьютерная электроника, видеокарты, процессоры, купить ПК, интернет-магазин, TechShop" />
    <meta name="author" content="Суханов Константин Олегович" />
    <meta name="robots" content="index, follow" />
    
    <!-- 🌐 Open Graph / Facebook / VK -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techshop.ru/" />
    <meta property="og:title" content="Tech.Shop — Компьютерная электроника" />
    <meta property="og:description" content="Широкий ассортимент комплектующих и периферии. Гарантия, доставка, поддержка." />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- 🐦 Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://techshop.ru/" />
    <meta property="twitter:title" content="Tech.Shop — Компьютерная электроника" />
    <meta property="twitter:description" content="Широкий ассортимент комплектующих и периферии. Гарантия, доставка, поддержка." />
    <meta property="twitter:image" content="/og-image.jpg" />
    
    <!-- 📱 Viewport & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- 🔒 Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- 🔗 Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- ⚡ Performance: Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- 🎨 Google Fonts (дублируется в CSS для надёжности) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- 🌓 Theme Initialization Script - MUST be before any rendering -->
    <script>
      (function() {
        try {
          // Проверяем localStorage на наличие сохранённой темы
          const themeStorage = localStorage.getItem('theme-storage');
          if (themeStorage) {
            const parsed = JSON.parse(themeStorage);
            const theme = parsed.state?.theme;
            if (theme === 'light' || theme === 'dark') {
              document.documentElement.setAttribute('data-theme', theme);
              // Обновляем theme-color для адресной строки мобильного браузера
              const metaTheme = document.querySelector('meta[name="theme-color"]');
              if (metaTheme) {
                metaTheme.setAttribute('content', theme === 'dark' ? '#0a0e17' : '#f8fafc');
              }
              return;
            }
          }
          // Если темы нет — проверяем системные настройки
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          // Fallback на тёмную тему при любой ошибке
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  
  <body>
    <!-- 🚫 No-JS Warning -->
    <noscript>
      <div style="
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1e293b;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 20px;
        z-index: 9999;
      ">
        <div>
          <h2 style="margin-bottom: 10px;">⚠️ JavaScript отключён</h2>
          <p>Для работы Tech.Shop необходимо включить JavaScript в настройках вашего браузера.</p>
        </div>
      </div>
    </noscript>
    
    <!-- 🎯 Root element for React -->
    <div id="root"></div>
    
    <!-- 🚀 Vite Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
